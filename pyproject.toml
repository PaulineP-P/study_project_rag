[project]
name = "rag-govdocs"
version = "0.1.0"
description = "RAG-ассистент по стратегиям цифровой трансформации регионов РФ"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.30",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
